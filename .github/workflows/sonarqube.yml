name: SonarQube
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner
      - name: Install Coverlet global tool
        run: |
          dotnet tool install --global coverlet.console
      - name: Install dev certificates
        run: |
          dotnet tool update -g linux-dev-certs
          dotnet linux-dev-certs install
          dotnet dev-certs https --clean
          dotnet dev-certs https --trust
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"MadWorldNL_Umiko" /o:"madworldnl" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.cs.opencover.reportsPaths=TestResults/*/coverage.opencover.xml /d:sonar.coverage.exclusions="**Test*.cs"
          dotnet restore source/MadWorldNL.Umiko.slnx
          dotnet build source/MadWorldNL.Umiko.slnx --no-restore
          coverlet source/MadWorldNL.Umiko.Controllers.IntegrationTests/bin/Debug/net10.0/IntegrationTests.dll \
            --target "dotnet" \
            --targetargs "test source/MadWorldNL.Umiko.slnx --no-build --no-restore --blame-hang-timeout 5min" \
            --include "[Api]*" \
            --include "[Bus]*" \
            --include "[Functions]*" \
            --include "[Domain]*" \
            --include "[Frameworks]*" \
            --include "[Postgresql]*" \
            --include "[RabbitMQ]*" \
            --format opencover \
            --output TestResults/coverage.opencover.xml
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"