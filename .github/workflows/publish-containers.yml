name: Publish Containers

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - project: source/MadWorldNL.Umiko.Controllers.Api/Api.csproj
            image: api
          - project: source/MadWorldNL.Umiko.Controllers.Bus/Bus.csproj
            image: bus

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Determine version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish container
        run: |
          dotnet publish ${{ matrix.project }} \
            --os linux --arch x64 \
            /t:PublishContainer \
            -p:ContainerRegistry=${{ env.REGISTRY }} \
            -p:ContainerRepository=${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.image }} \
            -p:ContainerImageTags='"${{ steps.version.outputs.tag }};latest"'