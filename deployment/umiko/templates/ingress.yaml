apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umiko-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: "traefik"
    {{- if .Values.ingress.certResolver }}
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.ingress.certResolver | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - {{- if not .Values.ingress.certResolver }}
      secretName: {{ .Values.ingress.tlsSecret }}
      {{- end }}
      hosts:
        - {{ .Values.ingress.domain }}
        - api.{{ .Values.ingress.domain }}
        - bus.{{ .Values.ingress.domain }}
        - admin.{{ .Values.ingress.domain }}
  rules:
    - host: api.{{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.api.name }}
                port:
                  number: {{ .Values.api.servicePort }}
    - host: bus.{{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.bus.name }}
                port:
                  number: {{ .Values.bus.servicePort }}
    - host: admin.{{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.webAdministrators.name }}
                port:
                  number: {{ .Values.webAdministrators.servicePort }}
    - host: {{ .Values.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.webUsers.name }}
                port:
                  number: {{ .Values.webUsers.servicePort }}