apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.bus.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.bus.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.bus.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.bus.name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Values.bus.name }}
          image: {{ .Values.bus.image }}:{{ .Values.appTag }}
          ports:
            - containerPort: {{ .Values.bus.containerPort }}
          resources:
            requests:
              cpu: {{ .Values.bus.resources.requests.cpu }}
              memory: {{ .Values.bus.resources.requests.memory }}
              ephemeral-storage: {{ index .Values.bus.resources.requests "ephemeral-storage" }}
            limits:
              cpu: {{ .Values.bus.resources.limits.cpu }}
              memory: {{ .Values.bus.resources.limits.memory }}
              ephemeral-storage: {{ index .Values.bus.resources.limits "ephemeral-storage" }}
          env:
            - name: ConnectionStrings__UmikoDb
              value: "Host={{ .Values.postgres.name }};Port={{ .Values.postgres.containerPort }};Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password={{ .Values.postgres.password }}"
            {{- if .Values.observability.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ .Values.observability.otelCollector.name }}:4317"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.bus.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.bus.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.bus.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.bus.name }}
spec:
  selector:
    app: {{ .Values.bus.name }}
  ports:
    - port: {{ .Values.bus.servicePort }}
      targetPort: {{ .Values.bus.containerPort }}
      protocol: TCP